name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"
  AWS_REGION: ap-south-2

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.environment == 'dev'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsWebDevRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CloudFormation outputs
        id: cfn
        run: |
          STACK_NAME="Dev-WebsiteStorageStack"

          S3_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          echo "bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "distribution=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $S3_BUCKET"
          echo "CloudFront Distribution: $DISTRIBUTION_ID"

      - name: Sync to S3
        run: |
          # Upload immutable assets with long cache
          aws s3 sync out/_next s3://${{ steps.cfn.outputs.bucket }}/_next \
            --cache-control "public, max-age=31536000, immutable"

          # Upload images with medium cache
          if [ -d "out/images" ]; then
            aws s3 sync out/images s3://${{ steps.cfn.outputs.bucket }}/images \
              --cache-control "public, max-age=86400"
          fi

          # Upload HTML and other files with no-cache
          aws s3 sync out s3://${{ steps.cfn.outputs.bucket }} \
            --exclude "_next/*" \
            --exclude "images/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete

      - name: Upload trailing-slash route pages
        run: bash ./scripts/upload-directory-indexes.sh "${{ steps.cfn.outputs.bucket }}" "${{ env.AWS_REGION }}"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn.outputs.distribution }} \
            --paths "/*"

      - name: Deployment Summary
        run: |
          CF_DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ steps.cfn.outputs.distribution }} \
            --query "Distribution.DomainName" \
            --output text)

          echo "## Dev Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://$CF_DOMAIN" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** ${{ steps.cfn.outputs.bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront:** ${{ steps.cfn.outputs.distribution }}" >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsWebProdRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CloudFormation outputs
        id: cfn
        run: |
          STACK_NAME="WebsiteStorageStack"

          S3_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          echo "bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "distribution=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "S3 Bucket: $S3_BUCKET"
          echo "CloudFront Distribution: $DISTRIBUTION_ID"

      - name: Sync to S3
        run: |
          # Upload immutable assets with long cache
          aws s3 sync out/_next s3://${{ steps.cfn.outputs.bucket }}/_next \
            --cache-control "public, max-age=31536000, immutable"

          # Upload images with medium cache
          if [ -d "out/images" ]; then
            aws s3 sync out/images s3://${{ steps.cfn.outputs.bucket }}/images \
              --cache-control "public, max-age=86400"
          fi

          # Upload HTML and other files with no-cache
          aws s3 sync out s3://${{ steps.cfn.outputs.bucket }} \
            --exclude "_next/*" \
            --exclude "images/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete

      - name: Upload trailing-slash route pages
        run: bash ./scripts/upload-directory-indexes.sh "${{ steps.cfn.outputs.bucket }}" "${{ env.AWS_REGION }}"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn.outputs.distribution }} \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://nmatix.com" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** ${{ steps.cfn.outputs.bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront:** ${{ steps.cfn.outputs.distribution }}" >> $GITHUB_STEP_SUMMARY
