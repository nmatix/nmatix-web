name: Bug Report
description: Report a bug or unexpected behavior
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser/Environment
      description: Browser name and version, or Node.js version
      placeholder: "Chrome 120, Safari 17, Node 20"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs/Screenshots
      description: Add any relevant console logs, error messages, or screenshots
